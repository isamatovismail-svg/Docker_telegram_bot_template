services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_bot_app
    restart: always
    env_file:
      - .env
    volumes:
      # SQLite bazasini konteyner qayta ishga tushsa ham saqlab qolish uchun
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
